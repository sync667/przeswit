[project]
name = "przeswit"
version = "2.0"
description = "Lokalna biblioteka miejsc w naturze — FastAPI, SQLite, lokalna Ollama."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8"]

[project.scripts]
przeswit = "app.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 200
target-version = "py310"
